name: Build distribution

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  SHELL: /bin/bash

jobs:
  buildNative:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:multilib-devel
    steps:
      - run: pacman --noconfirm -Sy sbt jdk-openjdk git mingw-w64 clang llvm lld nasm rustup python3

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2025-02-01 --profile minimal
          rustup default nightly-2025-02-01
          rustup component add rust-src
      - run: rustup target add i686-pc-windows-gnu i686-unknown-linux-gnu

      - run: scripts/ci/build-natives_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mppatch_ci_natives-linux.tar.gz
          path: target/mppatch_ci_natives-linux.tar.gz

  buildNativeImageLinux:
    runs-on: ubuntu-latest
    needs:
      - buildNative
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags

      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_natives-linux.tar.gz
          path: target/mppatch_ci_natives-linux
      - run: mv target/mppatch_ci_natives-linux/* target/
      - run: rm -rf target/mppatch_ci_natives-linux

      - name: Install cross toolchain deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib g++-multilib mingw-w64
      - name: Install sbt
        run: |
          curl -fLs https://github.com/sbt/sbt/releases/download/v1.9.7/sbt-1.9.7.tgz -o /tmp/sbt.tgz
          sudo tar -xzf /tmp/sbt.tgz -C /usr/local
          sudo ln -sf /usr/local/sbt/bin/sbt /usr/local/bin/sbt
          sbt --version

      - run: scripts/ci/build-ni_linux.sh

      - name: Audit baseline opcodes (no AVX/BMI/FMA)
        run: |
          sudo apt-get install -y binutils
          binaries=(target/native-image-linux/mppatch-installer*)
          for b in "${binaries[@]}"; do
            [ -f "$b" ] || continue
            echo "Auditing: $b"
            bash scripts/ci/audit-baseline.sh "$b" || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mppatch_ci_ni-linux
          path: target/native-image-linux/*

  buildNativeImageWindows:
    runs-on: windows-latest
    needs:
      - buildNative
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags

      - name: Install sbt
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sbt/sbt/releases/download/v1.9.7/sbt-1.9.7.tgz" -OutFile "$env:TEMP\sbt.tgz"
          New-Item -ItemType Directory -Force -Path "C:\sbt" | Out-Null
          tar -xzf "$env:TEMP\sbt.tgz" -C "C:\sbt"
          Add-Content $env:GITHUB_PATH "C:\sbt\sbt\bin"

      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_natives-linux.tar.gz
          path: target/mppatch_ci_natives-linux
      - run: mv target/mppatch_ci_natives-linux/* target/
      - run: rm -Recurse -Force -Verbose target/mppatch_ci_natives-linux

      - uses: ilammy/msvc-dev-cmd@v1
      - run: pwsh -file scripts/ci/build-ni_win32.ps1

      - name: Audit baseline opcodes (no AVX/BMI/FMA)
        shell: bash
        run: |
          binaries=(target/native-image-win32/mppatch-installer.exe)
          for b in "${binaries[@]}"; do
            [ -f "$b" ] || continue
            echo "Auditing: $b"
            bash scripts/ci/audit-baseline.sh "$b" || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mppatch_ci_ni-win32
          path: target/native-image-win32/*

  buildInstallerLinux:
    runs-on: ubuntu-latest
    needs:
      - buildNativeImageLinux
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags
      - run: sudo apt install libfuse2

      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_ni-linux
          path: target/native-image-linux

      - run: scripts/ci/build-installer_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mppatch_ci_installer-linux
          path: target/MPPatch-Installer_*

  buildInstallerWindows:
    runs-on: windows-latest
    needs:
      - buildNativeImageWindows
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags

      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_ni-win32
          path: target/native-image-win32

      - run: choco install nsis
      - run: pwsh -file scripts/ci/build-installer_win32.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mppatch_ci_installer-win32
          path: target/MPPatch-Installer_*

  publishArtifacts:
    runs-on: ubuntu-latest
    needs:
      - buildInstallerLinux
      - buildInstallerWindows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: git config --global --add safe.directory '*'
      - run: git -c submodule.recurse=false fetch --prune --unshallow --tags

      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_installer-linux
          path: mppatch_ci_installer-linux
      - uses: actions/download-artifact@v4
        with:
          name: mppatch_ci_installer-win32
          path: mppatch_ci_installer-win32
      - run: |
          mkdir -pv target/dist
          cp -v mppatch_ci_installer-linux/* target/dist/
          cp -v mppatch_ci_installer-win32/* target/dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: MPPatch ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: target/dist/**
          fail_on_unmatched_files: true
          generate_release_notes: false
